name: CI

on:
  push:
    branches: ["main"]
  pull_request:

env:
  YARN_ENABLE_SCRIPTS: false # disable post-install scripts

jobs:
  prepare-yarn-cache:
    name: Prepare Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js latest
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: "yarn"
      - name: Check Yarn dedupe
        run: |
          yarn dedupe --check
      - name: Check or update Yarn cache
        run: |
          yarn install --immutable --mode=skip-build
  test:
    name: Test (Node.js ${{ matrix.node-version }}, Hexo ${{ matrix.hexo-version }}, ${{ matrix.os }})
    needs: prepare-yarn-cache
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Pair older Hexo majors with older Node.js versions instead of
        # running the full cross product.
        include:
          - node-version: 20
            hexo-version: 5
            os: ubuntu-latest
          - node-version: 22
            hexo-version: 6
            os: ubuntu-latest
          - node-version: 24
            hexo-version: 7
            os: ubuntu-latest
          - node-version: 26
            hexo-version: 8
            os: ubuntu-latest
          - node-version: latest
            hexo-version: 8
            os: ubuntu-latest
            coverage: "true"
          - node-version: latest
            hexo-version: 8
            os: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js latest # Run yarn on latest node
        uses: actions/setup-node@v7
        with:
          node-version: latest
          cache: "yarn"
      - name: Install
        run: |
          yarn install
          yarn add --dev hexo@${{ matrix.hexo-version }}
      - name: Build
        run: |
          yarn build
      - name: Use Node.js ${{ matrix.node-version }} # Checkout node version for test executor
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test
        if: ${{ matrix.coverage == '' }}
        run: |
          node --test
      - name: Test with coverage
        if: ${{ matrix.coverage == 'true' }}
        run: |
          node --test --experimental-test-coverage --test-reporter=spec --test-reporter=lcov --test-reporter-destination=stdout --test-reporter-destination=coverage
      - name: Coveralls GitHub Action
        if: ${{ matrix.coverage == 'true' }}
        uses: coverallsapp/github-action@v2
        with:
          file: coverage
